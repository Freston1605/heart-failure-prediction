# CI for heart-failure-prediction.
#
# Minimal by design: test + build + deploy-manifest. No lint stage exists yet
# (the project has no linter configured); add a job here when one is adopted.
#
# Deps come from pyproject.toml extras (pinned for reproducibility). The
# separate `deploy-manifest` job installs the narrower Streamlit Community
# Cloud deploy manifest (app/requirements.txt) on every PR/push, so a broken
# or drifted deploy pin fails here instead of at Cloud boot (MEM117).

name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install package with dev/ml/app extras
        run: pip install -e ".[dev,ml,app]"

      - name: Dataset integrity gate
        run: make check-data

      - name: Run test suite
        run: pytest

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build wheel
        run: pipx run build

  deploy-manifest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: app/requirements.txt

      - name: Install deploy manifest
        run: pip install -r app/requirements.txt

      - name: Smoke import pinned stack
        run: python -c "import shap, streamlit, sklearn, joblib, pandas, numpy, scipy, mlflow"

      - name: Assert shap pin matches pyproject
        run: python -c "import shap; assert shap.__version__ == '0.52.0', shap.__version__"

      # The Predict page's import closure imports mlflow at module load, so a
      # manifest without mlflow crashes the deployed app at boot (M007 redeploy
      # 2026-10-13). Assert the manifest's mlflow pin matches pyproject [ml].
      - name: Assert mlflow pin matches pyproject
        run: python -c "import mlflow; assert mlflow.__version__ == '3.16.1', mlflow.__version__"
